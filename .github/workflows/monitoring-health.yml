name: Monitoring Health

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check main site
        id: site
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ vars.SITE_URL || 'https://uccingo.tech' }}" || echo "000")
          echo "status_code=$status_code" >> "$GITHUB_OUTPUT"
          if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Check chat endpoint
        id: chat
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ vars.SITE_URL || 'https://uccingo.tech' }}/api/chat" || echo "000")
          echo "status_code=$status_code" >> "$GITHUB_OUTPUT"
          if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Create issue on failure
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: steps.site.outcome == 'failure' || steps.chat.outcome == 'failure'
        env:
          SITE_OUTCOME: ${{ steps.site.outcome }}
          CHAT_OUTCOME: ${{ steps.chat.outcome }}
        with:
          script: |
            const failures = [];
            if (process.env.SITE_OUTCOME === 'failure') failures.push('Main site');
            if (process.env.CHAT_OUTCOME === 'failure') failures.push('Chat endpoint');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Health Check Failure: ${failures.join(', ')}`,
              body: `## Health Check Failure\n\n**Failed components:**\n${failures.map(f => `- ${f}`).join('\n')}\n\n**Timestamp:** ${new Date().toISOString()}\n\nPlease investigate and resolve the issue.`,
              labels: ['monitoring', 'needs-triage'],
            });
